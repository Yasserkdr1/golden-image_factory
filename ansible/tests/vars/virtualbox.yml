---
platform_name: "virtualbox"
grub_hardening_expected: true
time_sync_backend: "timesyncd"
admin_sudo_group_required: true
required_separate_mounts:
  - /tmp
  - /var
  - /home

required_mount_options:
  /tmp:
    - nodev
    - nosuid
    - noexec

  /var:
    - nodev
    - nosuid

  /home:
    - nodev
    - nosuid

  /dev/shm:
    - nodev
    - nosuid
    - noexec

  /proc:
    - nodev
    - nosuid
    - noexec
