---
# =============================================================================
# 19 — Sudo Hardening
# =============================================================================

- name: "19 | Ensure sudo package is installed"
  ansible.builtin.apt:
    name: sudo
    state: present
    update_cache: false

- name: "19 | Secure sudoers drop-in directory"
  ansible.builtin.file:
    path: "{{ sudo_hardening_directory }}"
    state: directory
    owner: root
    group: root
    mode: "0750"

- name: "19 | Deploy sudo hardening configuration"
  ansible.builtin.template:
    src: 99-hardening.j2
    dest: "{{ sudo_hardening_file }}"
    owner: root
    group: root
    mode: "0440"
    validate: "/usr/sbin/visudo -cf %s"

- name: "19 | Ensure sudo log file exists"
  ansible.builtin.file:
    path: "{{ sudo_hardening_log_file }}"
    state: touch
    owner: root
    group: root
    mode: "0600"
    modification_time: preserve
    access_time: preserve

- name: "19 | Validate complete sudoers configuration"
  ansible.builtin.command:
    cmd: visudo -c
  register: sudo_hardening_validation
  changed_when: false