---
name: Test Artifact Upload

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-upload:
    name: Test Artifact Upload
    runs-on: self-hosted

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Create test artifact
        run: |
          set -euo pipefail
          mkdir -p test-artifact
          echo "GitHub artifact upload test" > test-artifact/test.txt
          date >> test-artifact/test.txt

      - name: Upload test artifact
        uses: actions/upload-artifact@v4
        with:
          name: test-artifact
          path: test-artifact/
          if-no-files-found: error
          retention-days: 1
