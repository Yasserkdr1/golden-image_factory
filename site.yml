---
- name: Hardened Ubuntu Image Build Playbook
  hosts: all
  become: true
  pre_tasks:
    - name: Populate service facts
      ansible.builtin.service_facts:

    - name: Create hardening backup directory
      ansible.builtin.file:
        path: "{{ hardening_backup_dir }}"
        state: directory
        owner: root
        group: root
        mode: "0700"

  roles:
    - role: auditd_hardening
    - role: apparmor_hardening
    - role: ssh_security
  
